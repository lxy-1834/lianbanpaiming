name: 千里筛选

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qianli-pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 获取项目
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 从最新 Release 下载数据
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ths_daily_cache.json" \
            --pattern "all_daily_cache.json" \
            --pattern "ths_pool_history.json"

      - name: 运行千里筛选
        run: python qianli.py

      - name: 准备手机页面
        run: |
          mkdir -p _site
          cp qianli_latest.html _site/index.html

      - name: 保存本次结果
        uses: actions/upload-artifact@v4
        with:
          name: qianli-results
          path: |
            qianli_latest.html
            qianli_*.json
            qianli_prediction_log.jsonl
          if-no-files-found: warn

      - name: 上传页面
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 发布手机页面
        uses: actions/deploy-pages@v4
